<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>KUDO VoiceBot - Obstacle Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-highest": "#e0e3e5",
                      "primary-fixed": "#d8e2ff",
                      "primary-fixed-dim": "#adc6ff",
                      "surface-variant": "#e0e3e5",
                      "error-container": "#ffdad6",
                      "surface-container-lowest": "#ffffff",
                      "inverse-surface": "#2d3133",
                      "on-secondary-fixed": "#0b1c30",
                      "secondary": "#505f76",
                      "primary": "#0058be",
                      "tertiary-container": "#00873b",
                      "primary-container": "#2170e4",
                      "inverse-primary": "#adc6ff",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed": "#6bff8f",
                      "on-secondary-fixed-variant": "#38485d",
                      "surface-container-high": "#e6e8ea",
                      "surface-container": "#eceef0",
                      "on-tertiary-fixed-variant": "#005321",
                      "surface-bright": "#f7f9fb",
                      "on-tertiary-fixed": "#002109",
                      "on-primary-fixed-variant": "#004395",
                      "tertiary-fixed-dim": "#4ae176",
                      "secondary-container": "#d0e1fb",
                      "on-surface-variant": "#424754",
                      "surface-dim": "#d8dadc",
                      "on-tertiary-container": "#f7fff3",
                      "on-primary-container": "#fefcff",
                      "on-background": "#191c1e",
                      "on-secondary-container": "#54647a",
                      "on-error-container": "#93000a",
                      "on-error": "#ffffff",
                      "surface-tint": "#005ac2",
                      "error": "#ba1a1a",
                      "secondary-fixed": "#d3e4fe",
                      "background": "#f7f9fb",
                      "on-primary-fixed": "#001a42",
                      "surface": "#f7f9fb",
                      "on-surface": "#191c1e",
                      "tertiary": "#006b2d",
                      "inverse-on-surface": "#eff1f3",
                      "secondary-fixed-dim": "#b7c8e1",
                      "outline": "#727785",
                      "surface-container-low": "#f2f4f6",
                      "on-primary": "#ffffff",
                      "outline-variant": "#c2c6d6",
                      "on-tertiary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "8px",
                      "lg": "24px",
                      "base": "4px",
                      "margin-mobile": "20px",
                      "gutter-mobile": "16px",
                      "sm": "12px",
                      "md": "16px",
                      "xl": "32px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "label-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "title-lg": ["Inter"],
                      "title-md": ["Inter"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                      "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "title-md": ["16px", {"lineHeight": "24px", "fontWeight": "600"}]
              },
              "animation": {
                'shake': 'shake 0.8s cubic-bezier(.36,.07,.19,.97) both',
                'pulse-glow': 'pulseGlow 2s infinite',
              },
              "keyframes": {
                'shake': {
                  '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                  '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                  '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                  '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                },
                'pulseGlow': {
                  '0%': { boxShadow: '0 0 0 0 rgba(186, 26, 26, 0.4)' },
                  '70%': { boxShadow: '0 0 0 15px rgba(186, 26, 26, 0)' },
                  '100%': { boxShadow: '0 0 0 0 rgba(186, 26, 26, 0)' }
                }
              }
            },
          },
        }
    </script>
<style>
        body {
            background-color: #f7f9fb; /* fallback background */
        }
        /* Scrim overlay for dialog */
        .scrim {
            background-color: rgba(25, 28, 30, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen relative flex items-center justify-center antialiased">
<!-- Mock Background Content (to show it's an overlay) -->
<div class="absolute inset-0 z-0 overflow-hidden opacity-50 flex flex-col pointer-events-none">
<!-- TopAppBar Placeholder -->
<header class="bg-background dark:bg-on-background flex justify-between items-center px-margin-mobile h-16 w-full docked full-width top-0">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="robot_2">robot_2</span>
<span class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary-fixed">KUDO VoiceBot</span>
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="bluetooth_connected">bluetooth_connected</span>
</header>
<div class="flex-1 p-margin-mobile grid grid-cols-4 gap-gutter-mobile opacity-50">
<div class="col-span-4 bg-surface rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-outline-variant p-md h-32"></div>
<div class="col-span-2 bg-surface rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-outline-variant p-md h-48"></div>
<div class="col-span-2 bg-surface rounded-xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-outline-variant p-md h-48"></div>
</div>
<!-- BottomNavBar Placeholder -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-3 pb-6 bg-surface shadow-lg z-50 pointer-events-none">
<div class="flex flex-col items-center justify-center text-on-secondary-fixed-variant px-5 py-1">
<span class="material-symbols-outlined">home</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-5 py-1">
<span class="material-symbols-outlined">settings_remote</span>
</div>
<div class="flex flex-col items-center justify-center text-on-secondary-fixed-variant px-5 py-1">
<span class="material-symbols-outlined">history</span>
</div>
<div class="flex flex-col items-center justify-center text-on-secondary-fixed-variant px-5 py-1">
<span class="material-symbols-outlined">settings</span>
</div>
</nav>
</div>
<!-- Dialog Overlay -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-margin-mobile scrim transition-opacity duration-300">
<!-- Alert Card -->
<div class="bg-surface-container-lowest w-full max-w-sm rounded-[28px] shadow-[0px_8px_30px_rgba(15,23,42,0.12)] p-lg flex flex-col items-center text-center animate-shake transform transition-transform duration-300 scale-100">
<!-- Warning Icon Container -->
<div class="w-24 h-24 rounded-full bg-error-container flex items-center justify-center mb-md animate-pulse-glow border-2 border-error border-opacity-20">
<span class="material-symbols-outlined text-[48px] text-error" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<!-- Headline -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Obstacle Detected</h2>
<p class="font-title-md text-title-md text-error mb-lg">Robot Stopped</p>
<!-- Distance Data -->
<div class="bg-surface-container-low rounded-xl px-lg py-sm w-full mb-xl flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="straighten">straighten</span>
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider text-center">Distance</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center">18 cm</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full h-12 bg-primary text-on-primary rounded-[16px] font-label-lg text-label-lg flex items-center justify-center gap-sm active:scale-95 transition-transform shadow-sm hover:shadow-md active:shadow-inner" type="button">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
                    Resume
                </button>
<button class="w-full h-12 bg-transparent text-primary rounded-[16px] font-label-lg text-label-lg flex items-center justify-center hover:bg-surface-container-highest transition-colors active:scale-95 border border-outline-variant" type="button">
                    Cancel
                </button>
</div>
</div>
</div>


</body></html>
